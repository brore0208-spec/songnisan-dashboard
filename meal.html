<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>2026 속리산 여름집회 - 식사 메뉴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #f0f2f5; color: #333;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .header {
    background: linear-gradient(135deg, #1a5276, #2e86c1);
    color: white; padding: 20px 16px 14px; text-align: center;
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 1.2rem; margin-bottom: 2px; }
  .header p { font-size: 0.75rem; opacity: 0.8; }
  .nav-links { margin-top: 6px; }
  .nav-link {
    display: inline-block; padding: 4px 12px;
    background: rgba(255,255,255,0.2); border-radius: 12px;
    color: white; text-decoration: none; font-size: 0.72rem; margin: 0 2px;
  }
  .nav-link:hover { background: rgba(255,255,255,0.3); }

  .container { max-width: 700px; margin: 0 auto; padding: 16px 12px 100px; }

  .section-title {
    font-size: 1.1rem; font-weight: 700; color: #1a5276;
    padding: 8px 0; border-bottom: 2px solid #2e86c1; margin-bottom: 12px;
  }

  .map-image {
    width: 100%; border-radius: 12px; margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer;
  }

  .overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); z-index: 999;
    align-items: center; justify-content: center; cursor: pointer;
  }
  .overlay.show { display: flex; }
  .overlay img { max-width: 95%; max-height: 95%; object-fit: contain; }

  .scroll-top {
    position: fixed; bottom: 24px; right: 16px;
    width: 48px; height: 48px; border-radius: 50%;
    background: #1a5276; color: white; border: none;
    font-size: 1.4rem; cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    display: none; z-index: 200;
    align-items: center; justify-content: center;
  }
  .scroll-top.show { display: flex; }

  @media (min-width: 768px) {
    .header { padding: 24px 32px 18px; }
    .header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>2026 속리산 전국 여름집회</h1>
  <p>식사 메뉴</p>
  <div class="nav-links">
    <a class="nav-link" href="index.html">객실 배정</a>
    <a class="nav-link" href="members.html">신청자 명단</a>
    <a class="nav-link" href="students.html">교회학교 명단</a>
    <a class="nav-link" href="schedule.html">순편성표</a>
    <a class="nav-link" href="camp-timetable.html">캠프 시간표</a>
    <a class="nav-link" href="travel.html">여행 코스</a>
    <a class="nav-link" href="checklist.html">체크리스트</a>
    <a class="nav-link" href="faq.html">FAQ</a>
    <a class="nav-link" href="conference.html">집회 일정표</a>
  </div>
</div>

<div class="container">
  <div class="section-title">식사 메뉴</div>
  <img class="map-image" src="img_meal.jpg" alt="식사 메뉴" onclick="showOverlay(this.src)">
  <p style="text-align:center; font-size:0.8rem; color:#888;">이미지를 터치하면 크게 볼 수 있습니다.</p>
</div>

<div class="overlay" id="overlay" onclick="this.classList.remove('show')">
  <img id="overlayImg" src="" alt="">
</div>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>
function showOverlay(src) {
  document.getElementById("overlayImg").src = src;
  document.getElementById("overlay").classList.add("show");
}
window.addEventListener("scroll", () => {
  document.getElementById("scrollTopBtn").classList.toggle("show", window.scrollY > 400);
});
</script>
</body>
</html>
